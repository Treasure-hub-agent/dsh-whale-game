# ============================================================================
# dsh-whale-arcade 的 bundle patch —— 把启动器插件挂进 DSH 配置树
# ============================================================================
#
# 规则（照 DSH 商城上架契约）：
#   - `id` 必须全局唯一，且**等于包名**；上架预检按 id 比对 entryIds
#   - `id` 那一行不能写行尾注释，否则预检正则抓不到 entry ID
#   - `name` 解析包入口（main → lib/index.js，宿主半侧）
#   - package.json 里声明了 dsh.client，DSH 的模块系统会同时把这个包
#     扫描成「浏览器插件」，页面侧从 /plugins/dsh-whale-arcade/client.js 加载
#
# 本插件在宿主侧注册一条路由前缀（/whale-arcade），页面侧在 DSH 左侧栏底部
# 挂一条细条、点开是一枚悬浮气泡；不碰任何游戏代码，所以游戏厅怎么升级都与
# 插件无关。运行配置（端口 / 启动命令 / 自动启动）由插件自己管理：
#   $DSH_HOME/whale-arcade/config.json
# ============================================================================

- insert:
    - id: dsh-whale-arcade
      name: 'dsh-whale-arcade'
